<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Math Arena — Player</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
      --t1: #00e676;
      --t2: #ff1744;
      --ac: #40c4ff;
      --bg: #060f1e;
      --mid: #0a1830;
      --card: #0f2040
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: #fff;
      font-family: 'Exo 2', sans-serif
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity .25s
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none
    }

    /* Lobby */
    .logo {
      font-size: 52px;
      margin-bottom: 10px;
      animation: float 3s ease-in-out infinite
    }

    .game-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--t1), var(--ac), var(--t2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent
    }

    .card {
      background: var(--mid);
      border: 1px solid rgba(64, 196, 255, .15);
      border-radius: 16px;
      padding: 22px;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    label.lbl {
      font-size: 11px;
      color: #7a9cc6;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase
    }

    .info-box {
      font-size: 12px;
      color: #7a9cc6;
      text-align: center;
      padding: 8px;
      background: rgba(64, 196, 255, .06);
      border-radius: 8px;
      border: 1px solid rgba(64, 196, 255, .12)
    }

    /* Wait */
    .spinner {
      width: 56px;
      height: 56px;
      border: 3px solid rgba(64, 196, 255, .15);
      border-top-color: var(--ac);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 18px
    }

    /* Play */
    #s-play {
      padding: 0;
      justify-content: flex-start
    }

    #play-header {
      width: 100%;
      background: var(--mid);
      border-bottom: 1px solid rgba(64, 196, 255, .12);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0
    }

    #q-box {
      width: 100%;
      padding: 12px 16px;
      flex-shrink: 0
    }

    #q-tags {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap
    }

    .tag {
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase
    }

    /* BIGGER centred question text on mobile too */
    #q-text {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.5;
      color: #f0f4ff;
      text-align: center;
      padding: 4px 0
    }

    #ans-area {
      flex: 1;
      width: 100%;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden
    }

    /* MCQ */
    .opt-btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, .12);
      background: var(--card);
      color: #ddd;
      font-family: 'Exo 2';
      font-size: 16px;
      font-weight: 700;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all .15s
    }

    .opt-btn:active {
      transform: scale(.97)
    }

    .opt-btn .lbl2 {
      font-family: 'JetBrains Mono';
      font-size: 11px;
      font-weight: 700;
      opacity: .6
    }

    .opt-btn.sel {
      border-color: var(--ac);
      background: rgba(64, 196, 255, .12);
      color: var(--ac)
    }

    .opt-btn.correct-ans {
      border-color: var(--t1);
      background: rgba(0, 230, 118, .18);
      color: var(--t1)
    }

    .opt-btn.wrong-ans {
      border-color: var(--t2);
      background: rgba(255, 23, 68, .1);
      color: var(--t2);
      animation: shake .4s ease
    }

    /* ── NATIVE keyboard subjective ── */
    #subj-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%
    }

    #native-input {
      background: var(--card);
      border: 2px solid rgba(255, 255, 255, .15);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: 'JetBrains Mono';
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      outline: none;
      width: 100%;
      text-align: center;
      transition: border-color .2s;
      -webkit-appearance: none
    }

    #native-input:focus {
      border-color: var(--ac)
    }

    #native-input.wrong {
      border-color: var(--t2);
      animation: shake .4s ease
    }

    #subj-submit {
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-family: 'Exo 2';
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: all .2s;
      width: 100%
    }

    /* Pause overlay */
    #pause-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(3, 10, 20, .92);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px
    }

    #pause-overlay.active {
      display: flex
    }

    #pause-overlay .big-icon {
      font-size: 64px;
      animation: pop .4s ease
    }

    /* Banner */
    #feedback-banner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 800;
      text-align: center;
      z-index: 40;
      transition: opacity .3s;
      border-radius: 0 0 12px 12px;
      display: none;
      animation: slideDown .3s ease
    }

    /* Skipped overlay */
    #skip-overlay {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: rgba(255, 171, 64, .08);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center
    }

    #skip-overlay.active {
      display: flex
    }

    /* Shared */
    .ma-input {
      background: var(--card);
      border: 2px solid rgba(64, 196, 255, .2);
      color: #fff;
      padding: 11px 14px;
      border-radius: 9px;
      font-size: 16px;
      font-family: 'Exo 2';
      outline: none;
      width: 100%;
      transition: border .2s
    }

    .ma-input:focus {
      border-color: var(--ac)
    }

    .ma-btn {
      border: none;
      border-radius: 10px;
      font-family: 'Exo 2';
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
      padding: 13px 20px;
      font-size: 15px;
      width: 100%
    }

    .ma-btn:active {
      transform: scale(.97)
    }

    .primary {
      background: linear-gradient(135deg, var(--t1), #00b44a);
      color: #050d1a
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700
    }

    /* Between-question countdown */
    #between-overlay {
      position: absolute;
      inset: 0;
      z-index: 45;
      background: rgba(3, 10, 20, .85);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px
    }

    #between-overlay.active {
      display: flex
    }

    #between-num {
      font-family: 'JetBrains Mono';
      font-size: 96px;
      font-weight: 900;
      color: var(--ac);
      line-height: 1;
      text-shadow: 0 0 40px rgba(64, 196, 255, .6);
      animation: pop .4s ease
    }

    /* Gameover */
    .trophy {
      font-size: 80px;
      animation: float 2s ease-in-out infinite
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-8px)
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes pop {
      0% {
        transform: scale(.7)
      }

      60% {
        transform: scale(1.15)
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0)
      }

      25% {
        transform: translateX(-10px)
      }

      75% {
        transform: translateX(10px)
      }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }
  </style>
</head>

<body>

  <!-- ── LOBBY ── -->
  <div id="s-lobby" class="screen">
    <div class="logo">🧮</div>
    <div class="game-title">MATH ARENA</div>
    <div style="font-size:11px;letter-spacing:3px;color:#7a9cc6;margin:6px 0 24px">PLAYER DEVICE</div>
    <div class="card">
      <div>
        <label class="lbl">Session Code</label>
        <input id="inp-code" class="ma-input" placeholder="e.g. AB1C2D" maxlength="6"
          style="margin-top:5px;text-transform:uppercase;letter-spacing:4px;font-family:'JetBrains Mono';font-size:20px;text-align:center;" />
      </div>
      <div>
        <label class="lbl">Your Name (optional)</label>
        <input id="inp-name" class="ma-input" placeholder="Your name" style="margin-top:5px;font-size:14px;" />
      </div>
      <div>
        <label class="lbl">Your Team</label>
        <div style="display:flex;gap:8px;margin-top:5px">
          <button class="ma-btn" id="btn-t1" onclick="selectTeam(1)"
            style="flex:1;background:rgba(0,230,118,.12);color:var(--t1);border:2px solid rgba(0,230,118,.35)">🟢 Team
            1</button>
          <button class="ma-btn" id="btn-t2" onclick="selectTeam(2)"
            style="flex:1;background:rgba(255,23,68,.08);color:var(--t2);border:2px solid rgba(255,23,68,.3)">🔴 Team
            2</button>
        </div>
      </div>
      <div class="info-box">Same WiFi as the host device</div>
      <button class="ma-btn primary" onclick="joinSession()">Join Game →</button>
      <div id="err-msg" style="color:var(--t2);font-size:12px;text-align:center;display:none"></div>
    </div>
  </div>

  <!-- ── WAITING ── -->
  <div id="s-wait" class="screen hidden">
    <div class="spinner"></div>
    <h2 style="font-size:20px;font-weight:800;color:var(--ac)">Connected!</h2>
    <p style="font-size:13px;color:#7a9cc6;margin-top:8px">Waiting for the host to start…</p>
    <div id="wait-badge" class="pill"
      style="margin-top:20px;background:rgba(0,230,118,.15);color:var(--t1);border:1px solid rgba(0,230,118,.3)">🟢 Team
      1</div>
    <div id="wait-players" style="margin-top:10px;font-size:12px;color:#7a9cc6"></div>
    <div style="margin-top:16px;font-size:12px;color:#7a9cc6" id="wait-session"></div>
    <button onclick="requestCurrentQuestion()"
      style="margin-top:24px;background:rgba(64,196,255,.1);color:var(--ac);border:1px solid rgba(64,196,255,.2);border-radius:8px;padding:8px 16px;font-size:12px;cursor:pointer;font-family:'Exo 2'">
      🔄 Game started but not updating? Tap here
    </button>
  </div>

  <!-- ── PLAYING ── -->
  <div id="s-play" class="screen hidden">
    <!-- Pause overlay (shown over game when paused) -->
    <div id="pause-overlay">
      <div class="big-icon">⏸️</div>
      <div style="font-weight:900;font-size:26px;color:#fff;letter-spacing:2px">PAUSED</div>
      <div style="font-size:14px;color:#7a9cc6">Host has paused the game…</div>
    </div>

    <!-- Skip overlay -->
    <div id="skip-overlay">
      <div style="text-align:center">
        <div style="font-size:48px">⏭</div>
        <div style="font-size:20px;font-weight:900;color:#ffab40;margin-top:10px">Question Skipped</div>
      </div>
    </div>

    <!-- Between-question countdown overlay -->
    <div id="between-overlay">
      <div style="font-size:16px;color:#7a9cc6;letter-spacing:2px;text-transform:uppercase">Next question in</div>
      <div id="between-num">3</div>
      <div id="between-winner" style="font-size:18px;font-weight:800;color:var(--t1)"></div>
    </div>

    <!-- Feedback banner -->
    <div id="feedback-banner"></div>

    <!-- Header -->
    <div id="play-header">
      <div>
        <div id="ph-teamname" style="font-weight:900;font-size:15px;color:var(--t1)">Team 1</div>
        <div style="font-size:10px;color:#7a9cc6;letter-spacing:1px">YOUR TEAM</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <svg id="timer-svg" width="44" height="44">
          <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3" />
          <circle id="timer-arc" cx="22" cy="22" r="18" fill="none" stroke="var(--ac)" stroke-width="3"
            stroke-dasharray="113" stroke-dashoffset="0" stroke-linecap="round"
            style="transform:rotate(-90deg);transform-origin:22px 22px;transition:stroke-dashoffset 1s linear,stroke .5s" />
          <text id="timer-text" x="22" y="27" text-anchor="middle" fill="var(--ac)" font-size="13"
            font-family="JetBrains Mono" font-weight="700">25</text>
        </svg>
      </div>
      <div style="text-align:right">
        <div id="ph-score" style="font-family:'JetBrains Mono';font-size:24px;font-weight:700">0</div>
        <div style="font-size:10px;color:#7a9cc6;letter-spacing:1px">SCORE</div>
      </div>
    </div>

    <!-- Question — BIGGER, CENTRED -->
    <div id="q-box">
      <div id="q-tags"></div>
      <div id="q-text">Loading…</div>
    </div>

    <!-- Answer area -->
    <div id="ans-area"></div>
  </div>

  <!-- ── GAME OVER ── -->
  <div id="s-gameover" class="screen hidden">
    <div class="trophy">🏆</div>
    <h1 id="go-title" style="font-size:28px;font-weight:900;margin:14px 0 6px;color:var(--t1)">You Win!</h1>
    <p id="go-sub" style="font-size:15px;color:#7a9cc6"></p>
    <button class="ma-btn" onclick="location.reload()"
      style="margin-top:28px;max-width:220px;background:rgba(64,196,255,.15);color:var(--ac);border:1px solid rgba(64,196,255,.3)">🔄
      Play Again</button>
  </div>

  <script>
    // ── State ────────────────────────────────────────────────────────────────
    const S = {
      socket: null, session: null, team: null,
      teamName: '', playerName: '',
      score: 0,
      answered: false,
      timerVal: 25, timerTotal: 25, timerInt: null,
      currentQ: null,
    };

    // ── URL params ────────────────────────────────────────────────────────────
    const P = new URLSearchParams(location.search);
    if (P.get('session')) document.getElementById('inp-code').value = P.get('session').toUpperCase();
    if (P.get('team')) selectTeam(parseInt(P.get('team')));

    // ── Helpers ───────────────────────────────────────────────────────────────
    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }
    function showError(msg) {
      const el = document.getElementById('err-msg');
      el.textContent = msg; el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }
    function selectTeam(n) {
      S.team = `t${n}`;
      document.getElementById('btn-t1').style.boxShadow = n === 1 ? '0 0 0 3px var(--t1)' : 'none';
      document.getElementById('btn-t2').style.boxShadow = n === 2 ? '0 0 0 3px var(--t2)' : 'none';
    }

    // ── Join ──────────────────────────────────────────────────────────────────
    function joinSession() {
      const code = document.getElementById('inp-code').value.trim().toUpperCase();
      S.playerName = document.getElementById('inp-name').value.trim() || 'Player';
      if (!code || code.length < 4) return showError('Enter a valid session code');
      if (!S.team) return showError('Select your team first');

      const url = `${location.protocol}//${location.hostname}:3001`;
      S.socket = io(url, { transports: ['websocket'] });
      S.session = code;

      S.socket.on('connect', () => {
        S.socket.emit('join-team', { session: code, team: parseInt(S.team.slice(1)), playerName: S.playerName }, (res) => {
          if (!res.ok) { S.socket.disconnect(); return showError(res.error || 'Could not join'); }
          S.teamName = res.teamName;
          const isT1 = S.team === 't1';
          const col = isT1 ? 'var(--t1)' : 'var(--t2)';
          const badge = document.getElementById('wait-badge');
          badge.textContent = `${isT1 ? '🟢' : '🔴'} ${S.teamName}`;
          badge.style.background = isT1 ? 'rgba(0,230,118,.15)' : 'rgba(255,23,68,.1)';
          badge.style.color = col; badge.style.border = `1px solid ${col}`;
          document.getElementById('wait-players').textContent = `👤 ${res.playerName || S.playerName} — player #${res.playerCount} on this team`;
          document.getElementById('wait-session').textContent = `Session: ${code}`;
          show('s-wait');
          bindEvents();
          setTimeout(requestCurrentQuestion, 600);
          setTimeout(requestCurrentQuestion, 2200);
        });
      });
      S.socket.on('connect_error', () => showError('Cannot reach server. Check WiFi.'));
    }

    function requestCurrentQuestion() {
      if (!S.socket?.connected || !S.session) return;
      if (!document.getElementById('s-wait').classList.contains('hidden'))
        S.socket.emit('get-current-question', { session: S.session });
    }

    // ── Bind socket events ─────────────────────────────────────────────────────
    function bindEvents() {
      const s = S.socket;

      s.on('new-question', ({ question, timeLeft, scores, paused }) => {
        S.answered = false;
        S.currentQ = question;
        S.timerTotal = timeLeft || 25;
        S.timerVal = S.timerTotal;
        S.score = scores?.[S.team] || S.score;
        renderQuestion(question);
        hideBanner();
        hidePauseOverlay();
        hideSkipOverlay();
        hideBetween();
        startTimer(S.timerTotal);
        show('s-play');
        if (paused) showPauseOverlay();
      });

      // ── Pause / Resume ──────────────────────────────────────────────────────
      s.on('game-paused', () => {
        stopTimer();
        showPauseOverlay();
      });
      s.on('game-resumed', () => {
        hidePauseOverlay();
        if (!S.answered) startTimer(S.timerVal);
      });

      // ── Skip ────────────────────────────────────────────────────────────────
      s.on('question-skipped', () => {
        stopTimer();
        S.answered = true;
        showSkipOverlay();
        setTimeout(hideSkipOverlay, 2500);
      });

      // ── Answer feedback ─────────────────────────────────────────────────────
      s.on('answer-feedback', ({ correct, locked }) => {
        if (correct) {
          stopTimer();
          S.answered = true;
          lockAnswerUI();
          showBanner('✅  Correct! Your team pulled the rope 💪', 'var(--t1)', 'rgba(0,230,118,.15)', 2500);
        } else if (locked) {
          // Another player on this team already submitted — tell them
          S.answered = true;
          lockAnswerUI();
          showBanner('🔒  Your teammate already answered for this question', '#ffab40', 'rgba(255,171,64,.12)', 3000);
        } else {
          // Wrong answer — team is now locked, no retry
          S.answered = true;
          lockAnswerUI();
          shakeInputs();
          showBanner('❌  Wrong answer — team locked for this question', 'var(--t2)', 'rgba(255,23,68,.12)', 2500);
        }
      });

      // ── Timer adjusted by host ──────────────────────────────────────────────
      s.on('timer-adjusted', ({ newTime }) => {
        stopTimer();
        S.timerVal = newTime;
        if (newTime > S.timerTotal) S.timerTotal = newTime;
        updateTimerUI(newTime, S.timerTotal);
        if (!S.answered) startTimer(newTime);
      });

      // ── State update ────────────────────────────────────────────────────────
      s.on('state-update', ({ scores }) => {
        if (scores) { S.score = scores[S.team] || 0; document.getElementById('ph-score').textContent = S.score; }
      });

      // ── Question result (time up / other team correct) ──────────────────────
      s.on('question-result', ({ correctTeam, correctAnswer }) => {
        if (S.answered) return;
        stopTimer();
        if (!correctTeam) showBanner('⏰  Time\'s Up!', '#ffab40', 'rgba(255,171,64,.1)', 2000);
        else if (correctTeam === S.team) { S.answered = true; showBanner('✅  Correct! 💪', 'var(--t1)', 'rgba(0,230,118,.15)', 2000); }
        else showBanner(`❌  Other team got it! Answer: ${correctAnswer}`, 'var(--t2)', 'rgba(255,23,68,.1)', 2500);
      });

      // ── Between-question countdown ─────────────────────────────────────────
      s.on('between-countdown', ({ countdown }) => {
        if (countdown > 0) {
          showBetween(countdown);
        } else {
          hideBetween();
        }
      });

      // ── Quit / Game over ────────────────────────────────────────────────────
      s.on('session-ended', () => {
        stopTimer();
        document.getElementById('go-title').textContent = '🔚 Session Ended';
        document.getElementById('go-title').style.color = '#ffab40';
        document.getElementById('go-sub').textContent = 'The admin has permanently closed this session.';
        show('s-gameover');
      });

      s.on('player-removed', ({ reason }) => {
        stopTimer();
        document.getElementById('go-title').textContent = '🚫 Removed';
        document.getElementById('go-title').style.color = '#ffab40';
        document.getElementById('go-sub').textContent = reason || 'You were removed by the host.';
        show('s-gameover');
      });

      s.on('game-quit', () => {
        stopTimer();
        document.getElementById('go-title').textContent = '🚫 Game Ended';
        document.getElementById('go-title').style.color = '#ffab40';
        document.getElementById('go-sub').textContent = 'The host has ended the contest.';
        show('s-gameover');
      });
      s.on('game-over', ({ winner, winnerName }) => {
        stopTimer();
        const iWon = (winner === S.team) || (winner === (S.team === 't1' ? 'team1' : 'team2'));
        document.getElementById('go-title').textContent = iWon ? '🏆 Your Team Wins!' : '😔 You Lost';
        document.getElementById('go-title').style.color = iWon ? 'var(--t1)' : 'var(--t2)';
        document.getElementById('go-sub').textContent = iWon ? `Congratulations! ${winnerName} dominated!` : `${winnerName} won this time. Better luck next round!`;
        show('s-gameover');
      });
    }

    // ── Render question ────────────────────────────────────────────────────────
    const DIFF_COL = { easy: '#69f0ae', medium: '#ffab40', hard: '#ff5252' };

    function renderQuestion(q) {
      const isT1 = S.team === 't1';
      const col = isT1 ? '#00e676' : '#ff1744';
      document.getElementById('ph-teamname').textContent = S.teamName;
      document.getElementById('ph-teamname').style.color = col;
      document.getElementById('ph-score').style.color = col;
      document.getElementById('ph-score').textContent = S.score;
      document.getElementById('feedback-banner').style.display = 'none';

      const dc = DIFF_COL[q.diff] || '#aaa';
      document.getElementById('q-tags').innerHTML = `
    <span class="tag" style="background:${dc}18;color:${dc};border:1px solid ${dc}44">${q.diff}</span>
    <span class="tag" style="background:rgba(64,196,255,.1);color:var(--ac);border:1px solid rgba(64,196,255,.2)">${q.cat}</span>
    <span class="tag" style="background:rgba(180,100,255,.1);color:#c084fc;border:1px solid rgba(180,100,255,.2)">${q.type === 'mcq' ? 'MCQ' : 'SUBJECTIVE'}</span>`;
      document.getElementById('q-text').textContent = q.q;

      const area = document.getElementById('ans-area');
      area.innerHTML = '';
      if (q.type === 'mcq') buildMCQ(q, area, col);
      else buildSubjective(area, col);
    }

    // ── MCQ ────────────────────────────────────────────────────────────────────
    function buildMCQ(q, area, col) {
      const LABELS = ['A', 'B', 'C', 'D'];
      q.opts.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = `<span class="lbl2" style="color:${col}">${LABELS[i]}</span><span>${opt}</span>`;
        btn.onclick = () => {
          if (S.answered) return;
          document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('sel'));
          btn.classList.add('sel');
          submitAnswer(opt);
        };
        area.appendChild(btn);
      });
    }

    // ── SUBJECTIVE — uses phone's native keyboard ──────────────────────────────
    function buildSubjective(area, col) {
      area.innerHTML = `
    <div id="subj-wrap">
      <div style="font-size:13px;color:#7a9cc6;text-align:center;margin-bottom:4px">Type your answer using the keyboard</div>
      <input id="native-input" type="text" inputmode="decimal" placeholder="Type answer here…"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        style="border-color:rgba(255,255,255,.15)"/>
      <button id="subj-submit" class="ma-btn" disabled
        style="background:rgba(255,255,255,.05);color:#444;border:1px solid rgba(255,255,255,.08)">
        SUBMIT ✓
      </button>
    </div>`;

      const input = document.getElementById('native-input');
      const submit = document.getElementById('subj-submit');

      // Auto-focus so keyboard opens immediately
      setTimeout(() => { if (!S.answered) input.focus(); }, 300);

      const refresh = () => {
        const ok = input.value.trim().length > 0 && !S.answered;
        submit.disabled = !ok;
        submit.style.background = ok ? `linear-gradient(135deg,${col},${col}bb)` : 'rgba(255,255,255,.05)';
        submit.style.color = ok ? (S.team === 't1' ? '#050d1a' : '#fff') : '#444';
        submit.style.border = `1px solid ${ok ? col : 'rgba(255,255,255,.08)'}`;
      };

      input.addEventListener('input', refresh);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && input.value.trim() && !S.answered) {
          submitAnswer(input.value.trim());
        }
      });
      submit.onclick = () => {
        if (!input.value.trim() || S.answered) return;
        submitAnswer(input.value.trim());
      };
    }

    // ── Submit ─────────────────────────────────────────────────────────────────
    function submitAnswer(answer) {
      if (S.answered) return;  // belt-and-braces client lock
      console.log('[mobile] submit:', answer, S.session, S.team);
      // Lock immediately on submission — no retry allowed regardless of correct/wrong
      S.answered = true;
      lockAnswerUI();
      S.socket.emit('submit-answer', { session: S.session, team: S.team, answer });
    }

    // ── Lock answer UI — call after any submission (right or wrong) ───────────────
    function lockAnswerUI() {
      // Disable all MCQ buttons
      document.querySelectorAll('.opt-btn').forEach(b => {
        b.style.pointerEvents = 'none';
        b.style.opacity = b.classList.contains('sel') ? '1' : '0.35';
      });
      // Disable native input and submit button
      const inp = document.getElementById('native-input');
      const sub = document.getElementById('subj-submit');
      if (inp) { inp.disabled = true; inp.style.opacity = '0.5'; }
      if (sub) { sub.disabled = true; sub.style.opacity = '0.4'; }
    }

    // ── Answer UI helpers ────────────────────────────────────────────────────────
    function shakeInputs() {
      const inp = document.getElementById('native-input');
      if (inp) { inp.classList.add('wrong'); setTimeout(() => inp.classList.remove('wrong'), 600); }
      document.querySelectorAll('.opt-btn.sel').forEach(b => { b.classList.add('wrong-ans'); setTimeout(() => { b.classList.remove('wrong-ans', 'sel'); }, 700); });
    }

    function resetAnswerInputs(lock) {
      const inp = document.getElementById('native-input');
      if (inp) { if (!lock) { inp.value = ''; inp.style.borderColor = 'rgba(255,255,255,.15)'; } }
      if (!lock) {
        document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('sel', 'wrong-ans', 'correct-ans'));
        const submit = document.getElementById('subj-submit');
        if (submit) { submit.disabled = true; submit.style.background = 'rgba(255,255,255,.05)'; submit.style.color = '#444'; }
      }
    }

    // ── Pause overlay ──────────────────────────────────────────────────────────
    function showPauseOverlay() { document.getElementById('pause-overlay').classList.add('active'); }
    function hidePauseOverlay() { document.getElementById('pause-overlay').classList.remove('active'); }
    function showSkipOverlay() { const o = document.getElementById('skip-overlay'); o.classList.add('active'); o.style.display = 'flex'; }
    function hideSkipOverlay() { const o = document.getElementById('skip-overlay'); o.classList.remove('active'); o.style.display = 'none'; }

    // ── Banner ─────────────────────────────────────────────────────────────────
    function showBanner(msg, color, bg, ms) {
      const b = document.getElementById('feedback-banner');
      b.textContent = msg; b.style.color = color; b.style.background = bg;
      b.style.border = `1px solid ${color}44`; b.style.display = 'block';
      clearTimeout(b._t); b._t = setTimeout(hideBanner, ms);
    }
    function hideBanner() { document.getElementById('feedback-banner').style.display = 'none'; }

    // ── Between-Q overlay helpers ────────────────────────────────────────────────
    function showBetween(cd, winnerText, winnerColor) {
      const el = document.getElementById('between-overlay');
      document.getElementById('between-num').textContent = cd;
      document.getElementById('between-num').style.animation = 'none';
      void document.getElementById('between-num').offsetWidth; // reflow to restart animation
      document.getElementById('between-num').style.animation = 'pop .4s ease';
      if (winnerText) {
        document.getElementById('between-winner').textContent = winnerText;
        document.getElementById('between-winner').style.color = winnerColor || 'var(--ac)';
      } else {
        document.getElementById('between-winner').textContent = '';
      }
      el.classList.add('active');
      el.style.display = 'flex';
    }
    function hideBetween() {
      const el = document.getElementById('between-overlay');
      el.classList.remove('active');
      el.style.display = 'none';
    }

    // ── Timer ────────────────────────────────────────────────────────────────────
    const CIRC = 113;
    function startTimer(sec) {
      stopTimer(); S.timerVal = sec; updateTimerUI(sec, S.timerTotal);
      S.timerInt = setInterval(() => {
        S.timerVal--; updateTimerUI(S.timerVal, S.timerTotal);
        if (S.timerVal <= 0) stopTimer();
      }, 1000);
    }
    function stopTimer() { clearInterval(S.timerInt); S.timerInt = null; }
    function updateTimerUI(val, total) {
      const arc = document.getElementById('timer-arc');
      const txt = document.getElementById('timer-text');
      const pct = Math.max(0, val / Math.max(1, total));
      const col = val <= 5 ? 'var(--t2)' : val <= 10 ? '#ffab40' : 'var(--ac)';
      arc.style.strokeDashoffset = CIRC * (1 - pct);
      arc.style.stroke = col;
      txt.textContent = Math.max(0, val);
      txt.style.fill = col;
    }

    // ── Auto-join from QR ──────────────────────────────────────────────────────
    window.addEventListener('load', () => {
      if (P.get('session') && P.get('team')) {
        selectTeam(parseInt(P.get('team')));
        setTimeout(joinSession, 300);
      }
    });
  </script>
</body>

</html>
